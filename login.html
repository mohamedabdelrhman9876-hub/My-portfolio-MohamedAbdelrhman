<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Mohamed Abdelrhman - Frontend Developer Portfolio">
    <title>Mohamed Abdelrhman | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="navbar">
    <a class="logo" href="dashboard.html">portfolio.</a>
    <button class="menu-toggle" id="menuToggle" aria-label="Open navigation" aria-expanded="false">
        <span></span><span></span><span></span>
    </button>
    <nav id="mainNav">
        <a href="index.html" class="nav-link">Home</a>
        <a href="about.html" class="nav-link">About</a>
        <a href="portfolio.html" class="nav-link">Projects</a>
        <a href="contact.html" class="nav-link">Contact</a>
        <a href="login.html" class="nav-link" data-auth="login">Login</a>
        <a href="register.html" class="nav-link signup-nav" data-auth="register">Sign up</a>
        <a href="#" class="nav-link logout-nav" id="logoutLink" style="display:none;">Logout</a>
        <span class="user-nav" id="userNav" style="display:none;"></span>
    </nav>
</header>
<main>
<section class="page auth-page">
    <div class="auth-card">
        <p class="small-title">Welcome Back!</p>
        <h2>Login to your account</h2>
        <p>Continue your journey</p>
        <form id="loginForm" novalidate>
            <label>✉ Email address
                <input type="email" id="loginEmail" placeholder="Enter your email">
            </label>
            <label>🔒 Password
                <input type="password" id="loginPassword" placeholder="Enter your password">
            </label>
            <div class="auth-options">
                <a href="#" id="forgotPassword" aria-label="Forgot password?">
                    <i class="fas fa-question-circle"></i>
                </a>
            </div>
            <button class="btn btn-primary full" type="submit">Login →</button>
        </form>
        <p>Don't have an account? <a href="register.html" aria-label="Sign up">Sign up</a></p>
    </div>
</section>
</main>
<footer>
    <p>© <span id="year"></span> Mohamed Abdelrhman. All rights reserved.</p>
</footer>

<div id="toast" class="toast" role="status"></div>

<script type="module" src="js/main.js"></script>
<script type="module" src="js/auth.js"></script>
</body>
</html>
