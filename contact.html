<main>
<section class="page section">
    <div class="contact-layout">
        <div class="contact-info">
            <p class="small-title">Get In Touch</p>
            <h2>contact me</h2>
            <a href="mailto:mohamedabdelrhman@example.com">✉ mohamedabdelrhman9876@amail.com</a>
            <a href="tel:+250700000000">☎ +250 795969567</a>
            <a href="dashboard.html" aria-label="Location">⌖ Rwanda</a>
            <p class="contact-note">Replace the email and phone above with your real contact details before submission.</p>
        </div>
        <form id="contactForm" class="contact-form" novalidate>
            <label>Name
                <input type="text" id="contactName" placeholder="Your name">
                <small class="error" id="contactNameError"></small>
            </label>
            <label>Email
                <input type="email" id="contactEmail" placeholder="Your email">
                <small class="error" id="contactEmailError"></small>
            </label>
            <label>Message
                <textarea id="contactMessage" rows="5" placeholder="Your message"></textarea>
                <small class="error" id="contactMessageError"></small>
            </label>
            <button class="btn btn-primary" type="submit">Send message ↗</button>
        </form>
    </div>
</section>
