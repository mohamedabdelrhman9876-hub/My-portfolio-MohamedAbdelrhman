<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Mohamed Abdelrhman - Frontend Developer Portfolio">
    <title>Mohamed Abdelrhman | Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="navbar">
    <a class="logo" href="dashboard.html">portfolio.</a>
    <button class="menu-toggle" id="menuToggle" aria-label="Open navigation" aria-expanded="false">
        <span></span><span></span><span></span>
    </button>
    <nav id="mainNav">
        <a href="dashboard.html" class="nav-link">Home</a>
        <a href="about.html" class="nav-link">About</a>
        <a href="portfolio.html" class="nav-link">Projects</a>
        <a href="contact.html" class="nav-link">Contact</a>
        <a href="blog.html" class="nav-link">Blog</a>
        <a href="login.html" class="nav-link" data-auth="login">Login</a>
        <a href="register.html" class="nav-link signup-nav" data-auth="register">Sign up</a>
        <a href="#" class="nav-link logout-nav" id="logoutLink" style="display:none;">Logout</a>
        <span class="user-nav" id="userNav" style="display:none;"></span>
    </nav>
</header>
<main>
<section class="page auth-page">
    <div class="auth-card">
        <p class="small-title">Join Us</p>
        <h2>Create Your Account</h2>
        <p>Join our community and start your journey today</p>
        <form id="signupForm" novalidate>
            <label>👤 Full name
                <input type="text" id="signupName" placeholder="Enter your name">
            </label>
            <label>✉ Email address
                <input type="email" id="signupEmail" placeholder="Enter your email">
            </label>
            <label>🔒 Password
                <input type="password" id="signupPassword" placeholder="Create a password">
            </label>
            <label>🔒 Confirm password
                <input type="password" id="signupConfirm" placeholder="Confirm your password">
            </label>
            <button class="btn btn-primary full" type="submit">Create Account</button>
        </form>
        <p>Already have an account? <a href="login.html" aria-label="Login">Login</a></p>
    </div>
</section>
</main>
<footer>
    <p>© <span id="year"></span> Mohamed Abdelrhman. All rights reserved.</p>
</footer>

<div id="toast" class="toast" role="status"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
